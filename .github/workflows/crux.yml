name: crux

# THE CRUX EXPERIMENT, on hardware anyone can reproduce for free.
#
# ubuntu-24.04-arm is an Arm-hosted GitHub runner: Cobalt 100 / Neoverse N2,
# which is Armv9 with i8mm, bf16 and SVE2. It is free for public repositories,
# which means every number this repo publishes can be re-run by a stranger at
# zero cost. That is deliberate — an unreproducible benchmark is an anecdote.
#
# Note the asymmetry that motivates this project: AWS t4g (Graviton2) is
# Neoverse N1 and has NO i8mm at all. Free does not mean equivalent.

on:
  workflow_dispatch:
    inputs:
      reps:
        description: "Repetitions per measurement (higher = tighter CIs)"
        default: "10"
      sweep:
        description: "Prompt-batch sizes to sweep"
        default: "1,2,3,4,6,8,12,16,24,32"
      model_url:
        description: "Override the GGUF model URL"
        default: ""
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tools/**"
      - ".github/workflows/crux.yml"

permissions:
  contents: read

jobs:
  # Fast x86 job: if the adjudicator is broken there is no point burning an
  # Arm runner on measurements it would misjudge.
  skeptic:
    name: Skeptic self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate adjudicator against synthetic ground truth
        run: python3 tools/test_skeptic.py
      - name: Validate reporting pipeline end to end
        run: python3 tools/test_pipeline.py
      - name: Validate load generator against planted timings
        run: python3 tools/test_loadgen.py

  crux:
    name: Crux on Neoverse N2
    needs: skeptic
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git curl python3 binutils
          # perf is best-effort: hosted runners usually restrict it, and the
          # scripts degrade to a capability inventory rather than failing.
          sudo apt-get install -y linux-tools-common linux-tools-generic || true

      - name: Environment report (which Arm core is this?)
        run: bash scripts/00_env_report.sh

      - name: Fetch model
        env:
          SPECARM_MODEL_URL: ${{ github.event.inputs.model_url }}
        run: bash scripts/fetch_model.sh

      - name: Build llama.cpp (KleidiAI ON and OFF)
        run: bash scripts/01_build_llama.sh

      - name: Batch sweep (the crux measurement)
        env:
          SPECARM_REPS: ${{ github.event.inputs.reps || '10' }}
          SPECARM_SWEEP: ${{ github.event.inputs.sweep || '1,2,3,4,6,8,12,16,24,32' }}
        run: bash scripts/02_batch_sweep.sh

      - name: Kernel attribution (mechanism proof)
        run: bash scripts/03_kernel_attrib.sh

      # Serving under concurrency: the Cloud AI regime. A server batches
      # concurrent requests, so client concurrency drives the real matmul batch
      # size. Trimmed here to keep the free runner honest on time; run heavier
      # settings on a dedicated instance for headline numbers.
      - name: Serving benchmark (concurrency sweep)
        env:
          SPECARM_CONC: "1,2,4,8"
          SPECARM_SERVE_REQUESTS: "24"
        run: bash scripts/04_serve_bench.sh

      - name: Analyze and adjudicate
        run: python3 tools/analyze.py

      - name: Publish result to job summary
        if: always()
        run: |
          report="$(ls -1t results/report_*.md 2>/dev/null | head -n1 || true)"
          {
            if [ -n "$report" ]; then
              cat "$report"
            else
              echo "## No report produced"
              echo ""
              echo "The run did not get far enough to adjudicate. Check the logs above."
            fi
            echo ""
            echo "---"
            echo "<details><summary>Raw environment report</summary>"
            echo ""
            echo '```json'
            cat results/env.latest.json 2>/dev/null || echo "{}"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specarm-results-${{ github.run_number }}
          path: results/
          retention-days: 30
          if-no-files-found: warn
